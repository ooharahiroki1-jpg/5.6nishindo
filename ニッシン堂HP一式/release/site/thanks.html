<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>送信ありがとうございます | ニッシン堂音楽教室</title>
    <meta name="description" content="ニッシン堂音楽教室のサンクスページです。" />
    <link rel="canonical" href="https://nisshindo-music-demo.example/thanks.html" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23fff5ee'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='34' fill='%23ea7b63'%3E%E2%99%AA%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <header class="site-header is-scrolled">
      <div class="shell site-header__inner">
        <a class="brand" href="index.html" aria-label="ニッシン堂音楽教室">
          <span class="brand__mark">♪</span>
          <span class="brand__text">ニッシン堂音楽教室</span>
        </a>
        <a class="header-cta" href="index.html#contact">トップへ戻る</a>
      </div>
    </header>

    <main class="simple-page">
      <section class="simple-page__hero">
        <div class="shell">
          <p class="section-kicker">Thanks</p>
          <h1 class="fit-heading" data-lines="1" data-min="20">送信ありがとうございます</h1>
          <p>体験相談の送信を受け付けました。通常は1〜2営業日以内に、候補日時と初回のご案内をお送りします。</p>
        </div>
      </section>

      <section class="simple-page__section">
        <div class="shell info-grid">
          <article class="info-card">
            <h2 class="fit-heading" data-lines="1" data-min="18">次のご案内</h2>
            <ul class="info-list">
              <li>通常 1〜2 営業日以内に返信</li>
              <li>体験日程の候補をご案内</li>
              <li>不安点があれば追加相談も可能</li>
            </ul>
          </article>

          <article class="info-card">
            <h2 class="fit-heading" data-lines="1" data-min="18">当日の持ち物</h2>
            <ul class="info-list">
              <li>特別な持ち物は不要</li>
              <li>学校伴奏なら楽譜持参でOK</li>
              <li>保護者の付き添いも歓迎</li>
            </ul>
          </article>
        </div>
      </section>

      <section class="simple-page__section">
        <div class="shell info-grid">
          <article class="info-card">
            <h2 class="fit-heading" data-lines="1" data-min="18">先に見ておくと安心</h2>
            <div class="page-links">
              <a class="button button--soft" href="index.html#flow">体験の流れを見る</a>
              <a class="button button--soft" href="index.html#access">アクセスを見る</a>
              <a class="button button--line" href="index.html#contact">LINE相談へ戻る</a>
            </div>
          </article>

          <article class="info-card">
            <h2 class="fit-heading" data-lines="1" data-min="18">相談をやり直す</h2>
            <div class="page-links">
              <a class="button button--primary" href="index.html#contact">フォームへ戻る</a>
              <a class="button button--soft" href="index.html#pricing">料金を見る</a>
            </div>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
